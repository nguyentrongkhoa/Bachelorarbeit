name: Static Code Analysis

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    # official container of the Zephyr project
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Linter Tools
        run: |
          # install clang for linting
          sudo apt-get update && sudo apt-get install -y clang-tidy

      - name: Generate Compilation Database via CMake
        run: |
          # circumvent west build by using zephyr
          cmake -B build -G Ninja -DBOARD=qemu_cortex_m3 -DZEPHYR_BASE=/workspaces/zephyr -DCMAKE_EXPORT_COMPILE_COMMANDS=ON software/app

      - name: Run Clang-Tidy Linter
        run: |
          run-clang-tidy -p build/ "src/.*\.c$"

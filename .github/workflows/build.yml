name: Build Zephyr Project

on: 
  push:
    branches: [ master ]
  workflow_dispatch:

jobs: 
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/zephyr-build:latest
      options: --user root

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build Zephyr Blinky sample
        env:
          # Dem Docker-Container mitteilen, wo das vorinstallierte Zephyr liegt
          ZEPHYR_BASE: /workspaces/zephyr
        run: |
          # Wir bauen das Blinky-Beispiel direkt mit der vorinstallierten Toolchain
          west build -b qemu_cortex_m3 /workspaces/zephyr/samples/basic/blinky
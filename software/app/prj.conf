# This file contains selected Kconfig options for the application.

CONFIG_SENSOR=y
CONFIG_BME680=y # enable driver for BME680 gas sensor

CONFIG_GPIO=y

# for debugging purposes
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_LORA=y
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y
CONFIG_HAS_SEMTECH_LORAMAC=y
CONFIG_HAS_SEMTECH_RADIO_DRIVERS=y 

CONFIG_SHELL=y
CONFIG_I2C_SHELL=y

# Enable settings to store LoRaWAN parameters (DevNonce) in non-volatile memory 
CONFIG_LORAWAN_NVM_SETTINGS=y 
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
# use Non-Volatile Storage backend to store settings
# zephyr will look for a fixed partition with label "storage" in the device tree
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y 

# LoRaWAN services required for FUOTA
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_SERVICES_LOG_LEVEL_DBG=y
CONFIG_LORAWAN_APP_CLOCK_SYNC=y
CONFIG_LORAWAN_REMOTE_MULTICAST=y
CONFIG_LORAWAN_FRAG_TRANSPORT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# General Zephyr settings
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
CONFIG_LOG=y

# LoRa PHY
CONFIG_LORA=y

# NVS required to store LoRaWAN DevNonce
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Random number generator required for several LoRaWAN services
CONFIG_ENTROPY_GENERATOR=y

# LoRaWAN application layer
CONFIG_LORAWAN=y
CONFIG_LORAWAN_REGION_EU868=y
CONFIG_LORAWAN_NVM_SETTINGS=y

# LoRaWAN services required for FUOTA
CONFIG_LORAWAN_SERVICES=y
CONFIG_LORAWAN_SERVICES_LOG_LEVEL_DBG=y
CONFIG_LORAWAN_APP_CLOCK_SYNC=y
CONFIG_LORAWAN_REMOTE_MULTICAST=y
CONFIG_LORAWAN_FRAG_TRANSPORT=y

# enable SPI-NOR-Flash (external) to store firmware result for FUOTA
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_SFDP_RUNTIME=y   # auto-detects geometry at boot

# Flash driver to store firmware image
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# Random number generator required for several LoRaWAN services
CONFIG_ENTROPY_GENERATOR=y

# GPS module
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# I2C1 for gas sensors
CONFIG_I2C=y

CONFIG_CBPRINTF_FP_SUPPORT=y # floating point support (for formatting FP numbers to strings)

CONFIG_HWINFO=y # to extract hardware ID, DevEUI-64 etc

# Increase system workqueue stack to allow Semtech soft secure-element
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_HAS_SEMTECH_SOFT_SE=y # Enable Semtech software Secure Element implementation for LoRaMac-node


